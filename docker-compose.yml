services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sample-splitting-api:latest
    container_name: sample-splitting-api
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /app/data/packing.db
    volumes:
      - sample_splitting_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  sample_splitting_data:
